security:
  enabled: true
  use_shell_execution: true
  allowed_commands:
    - bash
    - sh
    - git
    - ls
    - cat
    - head
    - tail
    - grep
    - find
    - wc
    - sort
    - uniq
    - diff
    - tree
    - stat
    - file
    - du
    - realpath
    - basename
    - dirname
    - mkdir
    - touch
    - cp
    - mv
    - rm
    - sed
    - awk
    - xargs
    - node
    - npm
    - npx
    - python
    - python3
    - pip
    - pip3
    - cargo
    - rustc
    - go
    - make
    - curl
    - wget
    - jq
    - tar
    - unzip
    - zip
    - ssh
    - scp
    - rsync
    - gpg
    - yarn
    - pnpm
    - tsc
    - stow
    - gh
    - gh-26
    - gh-06
    - gh-df
    - gh-do
    - gh-odo
    - chronix
    - grove
    - pulse
    - which
    - chmod
    - cd
    - multica

  blocked_patterns:
    - '(?i)(^|\s)__HOME_REGEX__\\\.ssh(\\|\s|$)'
    - '(?i)(^|\s)__HOME_REGEX__\\\.gnupg(\\|\s|$)'
    - '(?i)(^|\s)__HOME_REGEX__\\\.aws(\\|\s|$)'
    - '(?i)(^|\s)__HOME_REGEX__\\\.config\\gh(\\|\s|$)'
    - '(?i)(^|\s)__HOME_REGEX__\\\.docker\\config\.json(\s|$)'
    - '(?i)(^|\s)__HOME_REGEX__\\\.npmrc(\s|$)'
    - '(?i)(^|\s)__HOME_REGEX__\\\.netrc(\s|$)'
    - '(?i)(^|\s)__HOME_REGEX__\\\.config\\gcloud(\\|\s|$)'
    - '(?i)(^|\s)__HOME_REGEX__\\\.kube(\\|\s|$)'
    - '(?i)(^|\s)__HOME_REGEX__\\\.password-store(\\|\s|$)'
    - '(?i)(^|\s)__GIT_BASH_HOME_REGEX__/\.ssh(/|\s|$)'
    - '(?i)(^|\s)__GIT_BASH_HOME_REGEX__/\.gnupg(/|\s|$)'
    - '(?i)(^|\s)__GIT_BASH_HOME_REGEX__/\.aws(/|\s|$)'
    - '(?i)(^|\s)__GIT_BASH_HOME_REGEX__/\.config/gh(/|\s|$)'
    - '(?i)(^|\s)__GIT_BASH_HOME_REGEX__/\.kube(/|\s|$)'
    - '(?i)(^|\s)__SYSTEMROOT_REGEX__\\System32\\config\\(SAM|SECURITY|SYSTEM)(\\|\s|$)'
    - '(?i)(^|\s)C:\\Windows\\System32\\config\\systemprofile(\\|\s|$)'
    - '(?i)rm\s+.*-rf.*\s+[A-Z]:\\?(\s|$)'
    - '\.\./\.\./\.\.'

  max_execution_time: 300s
  max_output_size: 10485760
  working_directory: __WINDOWS_HOME_SLASH__
  audit_log: true
