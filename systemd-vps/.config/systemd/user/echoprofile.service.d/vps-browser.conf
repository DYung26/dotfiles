[Unit]
# The browser runs in its own Xvfb display; it does not depend on an interactive desktop session.
After=network-online.target

[Service]
Environment=ECHOPROFILE_HOST=100.82.234.105
Environment=ECHOPROFILE_BIND_LOOPBACK=1
Environment=ECHOPROFILE_BROWSER_EXTENSION_DIR=%h/.local/share/uv/tools/echoprofile/lib/python3.12/site-packages/echoprofile/browser_extension
Environment=ECHOPROFILE_PORT=8756
Environment=DISPLAY=:2
Environment=ECHOPROFILE_SWITCHBOARD_DIR=%h/Projects/switchboard/dist
Environment=ECHOPROFILE_MULTICA_DIR=%h/Projects/multica-web-runtime/extension/dist
Environment=ECHOPROFILE_CDP_PORT=9222
