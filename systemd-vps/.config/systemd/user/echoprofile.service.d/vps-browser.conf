[Unit]
# The browser runs in its own Xvfb display; it does not depend on an interactive desktop session.
After=network-online.target

[Service]
Environment=ECHOPROFILE_HOST=127.0.0.1
Environment=ECHOPROFILE_PORT=8756
Environment=DISPLAY=:2
Environment=ECHOPROFILE_SWITCHBOARD_DIR=%h/Projects/switchboard/dist
Environment=ECHOPROFILE_MULTICA_DIR=
Environment=ECHOPROFILE_CDP_PORT=9222
