[Unit]
After=network-online.target
PartOf=

[Service]
ExecStartPre=
ExecStartPre=/usr/bin/bash -c "if [ ! -S /tmp/.X11-unix/X2 ]; then /usr/bin/Xvfb :2 -screen 0 3072x1600x24 -nolisten tcp -ac >/tmp/echoprofile-xvfb.log 2>&1 & echo $! > /home/dyung/.local/share/echoprofile-xvfb.pid; for i in $(seq 1 50); do [ -S /tmp/.X11-unix/X2 ] && exit 0; sleep 0.1; done; exit 1; fi"
Environment=DISPLAY=:2
