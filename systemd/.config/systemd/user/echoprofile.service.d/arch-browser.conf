[Service]
Environment=ECHOPROFILE_NO_RELOAD=1
Environment=ECHOPROFILE_HOST=0.0.0.0
Environment=ECHOPROFILE_CHANNEL=
Environment=ECHOPROFILE_SWITCHBOARD_DIR=%h/Projects/switchboard.wt/feat-network-replay/dist
Environment=ECHOPROFILE_MULTICA_DIR=%h/Projects/multica-web-runtime/extension/dist
Environment=ECHOPROFILE_BROWSER_EXTENSION_DIR=%h/.local/share/uv/tools/echoprofile/lib/python3.13/site-packages/echoprofile/browser_extension
Environment=ECHOPROFILE_EXTRA_EXTENSION_DIRS=%h/.local/share/echoprofile/playwright-extension
Environment=ECHOPROFILE_CDP_PORT=9222
ExecStart=
ExecStart=%h/.local/bin/echoprofile serve
