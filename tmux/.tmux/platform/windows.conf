# Windows / psmux
# NOTE: bare "bash", not the full path. psmux's warm-pane cd-injection
# picks bash vs PowerShell syntax by matching default-shell against a
# table of bare shell names; a full path falls through to the
# PowerShell-form default and gets fed into bash verbatim, breaking on
# attach (and popups) with "syntax error near unexpected token '('".
# See https://github.com/psmux/psmux/issues/672.
set -g default-shell "bash"
set -g default-terminal "xterm-256color"
