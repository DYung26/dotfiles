# session-names.conf
#
# Maps a repo directory name (under ~/Projects) to the tmux session name
# tmux-switcher.sh should treat as that repo's session, when it differs
# from the repo name itself. One `repo=session` per line. Lines starting
# with # and blank lines are ignored.
#
# Only add an entry here if you already have (or intend to keep) a
# manually-named session for that repo. Everything not listed here
# defaults to a session named exactly after the repo.

main-vazzel-api=vazzel
main-vazzel-frontend=vazzel-frontend
