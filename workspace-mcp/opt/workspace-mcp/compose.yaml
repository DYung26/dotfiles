services:
  workspace-mcp:
    image: workspace-mcp:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workspace-mcp
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /home/dyung/Services/workspace-mcp
    env_file:
      - /home/dyung/Services/workspace-mcp/.env
    environment:
      HOME: /home/dyung/Services/workspace-mcp/home
      UV_CACHE_DIR: /home/dyung/Services/workspace-mcp/uv-cache
      GOOGLE_MCP_CREDENTIALS_DIR: /home/dyung/Services/workspace-mcp/credentials
    ports:
      - "127.0.0.1:8003:8003"
    volumes:
      - /home/dyung/Services/workspace-mcp:/home/dyung/Services/workspace-mcp:rw
    network_mode: bridge
    healthcheck:
      test:
        - CMD-SHELL
        - 'code=$$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:8003/mcp); case "$$code" in 200|400|401|405) exit 0 ;; *) exit 1 ;; esac'
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
